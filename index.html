<style>
  /* Палитра в стиле розового пиксельного интерфейса */
  :root { --bg: #fbe9ee; --panel: #fde3ea; --btn: #ec8aa0; --dark: #8c2a3c; --ink: #2b2233; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--dark);
    font-family: ui-monospace, "Courier New", Courier, monospace; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #game { width: min(100%, 800px); }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  #canvas { border: 4px solid var(--dark); border-radius: 12px; }

  /* Экраны меню поверх игры */
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(251, 233, 238, .85); padding: 16px; z-index: 10;
  }
  .hidden { display: none !important; }
  /* Пиксельная монетка в тексте */
  .coin { display: inline-block; width: 12px; height: 14px; background: #f7c948; border: 2px solid var(--ink); border-radius: 4px; box-shadow: inset -3px 0 0 #e0a62e, inset 2px 0 0 #fff4c2; vertical-align: -2px; }
  .panel {
    background: var(--panel); border: 4px solid var(--dark); border-radius: 16px;
    box-shadow: 0 6px 0 var(--dark); padding: 24px; width: 100%; max-width: 420px;
    text-align: center; max-height: 100%; overflow-y: auto;
  }
  .panel.wide { max-width: 640px; }
  h1 { font-size: 34px; letter-spacing: 4px; margin-bottom: 8px; }
  h2 { font-size: 24px; letter-spacing: 2px; margin-bottom: 12px; }
  .heart { color: var(--btn); }
  .sub, .hint { font-size: 14px; font-weight: normal; line-height: 1.5; margin-bottom: 16px; }
  .hint { opacity: .8; margin: 16px 0 0; }
  /* Кнопки как START / BACK из референса */
  button {
    font: inherit; font-size: 17px; letter-spacing: 2px; text-transform: uppercase;
    color: #fff; background: var(--btn); border: 3px solid var(--dark); border-radius: 14px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(140,42,60,.25);
    padding: 10px 16px; cursor: pointer; display: block; width: 100%; margin-top: 10px;
  }
  button:hover:not(:disabled) { filter: brightness(1.06); }
  button:active:not(:disabled) { transform: translateY(2px); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--dark); box-shadow: none; border-style: dashed; font-size: 14px; }

  /* Магазин персонажей */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .card { background: #fff6f8; border: 3px solid #e7b3c0; border-radius: 12px; padding: 10px 8px; }
  .card.selected { border-color: var(--dark); }
  .card.locked canvas, .card.locked img { filter: grayscale(1) brightness(1.1); opacity: .55; }
  .pic { height: 56px; display: flex; align-items: center; justify-content: center; }
  .pic canvas, .pic img { width: 48px; height: 48px; object-fit: contain; }
  .name { font-size: 13px; margin-top: 4px; }
  .card button { font-size: 13px; letter-spacing: 1px; padding: 6px 4px; }

  /* Кнопка «пригнуться» — только на сенсорных экранах во время игры */
  #duckBtn {
    position: fixed; left: 16px; bottom: 16px; width: 72px; height: 72px;
    border-radius: 50%; font-size: 28px; display: none; opacity: .85; margin: 0;
  }
  body.touch.playing #duckBtn { display: block; }
</style>

<body>

<div id="game"><canvas id="canvas" aria-label="Игровое поле"></canvas></div>

<!-- ===== Картинки персонажей =====
     Пока строки ниже закомментированы, персонажи рисуются пиксель-артом прямо в коде.
     Чтобы поставить свою картинку: положите файл (например p1.png, ~40x40, лучше с прозрачным фоном)
     рядом с index.html и раскомментируйте нужную строку <img ...>
     (уберите знаки комментария в начале и в конце этой строки). -->
<div id="sprites" hidden>
  <!-- ЗАМЕНИТЬ НА СВОЮ КАРТИНКУ: персонаж 1 -->
  <!-- <img src="p1.png" alt="Персонаж 1" data-char="0"> -->
  <!-- ЗАМЕНИТЬ НА СВОЮ КАРТИНКУ: персонаж 2 -->
  <!-- <img src="p2.png" alt="Персонаж 2" data-char="1"> -->
  <!-- ЗАМЕНИТЬ НА СВОЮ КАРТИНКУ: персонаж 3 -->
  <!-- <img src="p3.png" alt="Персонаж 3" data-char="2"> -->
  <!-- ЗАМЕНИТЬ НА СВОЮ КАРТИНКУ: персонаж 4 -->
  <!-- <img src="p4.png" alt="Персонаж 4" data-char="3"> -->
  <!-- ЗАМЕНИТЬ НА СВОЮ КАРТИНКУ: персонаж 5 -->

</div>

<!-- Главное меню -->
<div id="menu" class="overlay">
  <div class="panel">
    <h1>РАННЕР</h1>
    <p class="heart">♥</p>
    <p class="sub">Прыгай через кусты и брёвна, уворачивайся от птиц, собирай коины и открывай новых персонажей.</p>
    <button id="btnPlay">Играть</button>
    <button id="btnShop">Персонажи</button>
    <button id="btnReset" class="ghost">Сбросить прогресс</button>
    <p class="hint">Пробел / ↑ / тап — прыжок<br>↓ / кнопка ⬇ — пригнуться<br>Каждые 500 очков = 1 коин</p>
  </div>
</div>

<!-- Выбор персонажа / магазин -->
<div id="shop" class="overlay hidden">
  <div class="panel wide">
    <h2>ПЕРСОНАЖИ</h2>
    <p class="sub">У вас: <b id="shopCoins">0</b> <i class="coin"></i></p>
    <div id="shopGrid" class="grid"></div>
    <button id="btnShopBack">« Назад</button>
  </div>
</div>

    <h2>GAME OVER</h2>
    <p class="sub" id="overText"></p>
    <button id="btnRestart">Рестарт</button>
    <button id="btnOverMenu">Меню</button>
  </div>
</div>

<button id="duckBtn" aria-label="Пригнуться">⬇</button>

<script>
// ===================== НАСТРОЙКИ =====================
const W = 800, H = 300, GROUND = 262;          // логический размер поля и линия земли
const GRAVITY = 2600, JUMP_V = 820;            // гравитация и сила прыжка (пикс/с)
const START_SPEED = 380, MAX_SPEED = 950, ACCEL = 7; // скорость мира и её рост в секунду
const POINTS_PER_COIN = 500;                   // сколько очков = 1 коин
const OUTLINE = '#2b2233';                     // цвет пиксельного контура

// ===================== ПИКСЕЛЬ-АРТ =====================
// Любой спрайт — это список прямоугольников на пиксельной сетке: [x, y, ширина, высота, цвет].
// parts — основные формы (получают тёмный контур), det — детали поверх (глаза, полоски, блики).
function drawParts(g, parts, det, x, y, u) {
  g.fillStyle = OUTLINE;                        // 1) контур со скруглёнными углами
  for (const [px, py, w, h] of parts) {
    g.fillRect(x + (px - 1) * u, y + py * u, (w + 2) * u, h * u);
    g.fillRect(x + px * u, y + (py - 1) * u, w * u, (h + 2) * u);
  }
  for (const [px, py, w, h, c] of parts.concat(det)) { // 2) заливка и детали
    g.fillStyle = c; g.fillRect(x + px * u, y + py * u, w * u, h * u);
  }
}

// Лапы: кадры бега 0/1 и прыжок (2)
function legs(f, c, w = 2) {
  if (f === 2) return [[2, 12, 3, 2, c], [11, 12, 3, 2, c]];
  const s = f ? 1 : 0;
  return [[4 + s, 13, w, 2, c], [9 - s, 13, w, 2, c]];
}
// Виды персонажей на сетке 16x16 (смотрят вправо). p — палитра, f — кадр.
const SPECIES = {
  cat: (p, f) => [
    [[1,4,2,2,p.b],[2,6,2,3,p.b],[3,8,9,5,p.b], ...legs(f,p.b), [9,3,6,6,p.b],[9,1,2,2,p.b],[13,1,2,2,p.b]],
    [[1,4,2,1,p.l],[5,8,1,3,p.d],[7,8,1,3,p.d],[11,3,2,1,p.d],[3,12,9,1,p.s],[10,7,4,2,p.l],
     [10,5,1,2,p.e],[13,5,1,2,p.e],[11,7,2,1,p.n],[10,2,1,1,p.n],[13,2,1,1,p.n]],
  ],
  bunny: (p, f) => [
    [[1,8,2,2,p.b],[3,8,8,5,p.b], ...legs(f,p.b), [9,4,5,5,p.b],[9,1,2,3,p.b],[12,1,2,3,p.b]],
    [[10,1,1,3,p.l],[13,1,1,3,p.l],[3,12,8,1,p.s],[12,5,1,2,p.e],[13,7,1,1,p.n]],
  ],
  sheep: (p, f) => [
    [...legs(f,p.d,1), [2,6,10,7,p.b],[1,7,12,5,p.b],[11,4,4,5,p.l],[11,3,3,2,p.b],[10,5,1,2,p.l]],
    [[3,7,2,1,p.n],[7,6,2,1,p.n],[4,10,2,1,p.n],[8,9,2,1,p.n],[1,11,11,1,p.s],[13,6,1,1,p.e]],
  ],
  goat: (p, f) => [
    [[2,6,1,3,p.d],[3,8,8,5,p.b], ...legs(f,p.b), [10,3,5,5,p.b],[9,4,1,2,p.b],[11,1,1,2,p.d],[13,1,1,2,p.d],[14,8,1,2,p.d]],
    [[4,11,6,1,p.l],[6,9,2,1,p.s],[3,12,8,1,p.s],[12,6,3,2,p.l],[11,4,1,1,p.e],[13,4,1,1,p.e]],
  ],
};

// Персонажи: b — основной цвет, d — тёмный, l — светлый, s — тень, e — глаза, n — нос/акцент
const CHARACTERS = [
  { name: 'Котик',       kind: 'cat',   price: 0,  pal: { b:'#c98a4b', d:'#8d5a2b', l:'#f5dfbd', s:'#a86d36', e:OUTLINE, n:'#e88aa0' } },
  { name: 'Зайка',       kind: 'bunny', price: 5,  pal: { b:'#ffffff', d:'#b9cdf0', l:'#b9cdf0', s:'#d3e0f5', e:'#e0414f', n:'#f4a6ba' } },
  { name: 'Овечка',      kind: 'sheep', price: 15, pal: { b:'#f2a7c6', d:'#6b4a3a', l:'#f7dfc4', s:'#d98aab', e:OUTLINE, n:'#ffd3e4' } },
  { name: 'Козлик',      kind: 'goat',  price: 30, pal: { b:'#b98b69', d:'#6e4a35', l:'#e3c6a6', s:'#9a6f50', e:'#f2c94c', n:'#000' } },
  { name: 'Золотой кот', kind: 'cat',   price: 60, pal: { b:'#f7c948', d:'#d4911f', l:'#fff4c2', s:'#e0a62e', e:OUTLINE, n:'#e88aa0' } },
];
// Рисует персонажа: свою картинку (если подключена) или пиксель-арт. size — сторона квадрата.
function drawChar(g, c, x, y, size, f) {
  if (c.img) { g.drawImage(c.img, x, y, size, size); return; }
  const [parts, det] = SPECIES[c.kind](c.pal, f);
  drawParts(g, parts, det, x, y, size / 16);
}

// Препятствия на земле (из тайлсета): куст, бревно, синий гриб, ёлка. w, h — размер в клетках, u — размер клетки
const G = '#4e9a3a', GL = '#7cc24f', GD = '#2f6b2a';
const GROUND_KINDS = [
  { name: 'bush', u: 3, w: 10, h: 7, parts: [[1,1,8,6,G],[0,3,10,4,G],[3,0,4,2,G]],
    det: [[2,2,2,1,GL],[4,1,2,1,GL],[7,3,1,1,GL],[1,6,8,1,GD]] },
  { name: 'log', u: 3, w: 13, h: 5, parts: [[0,0,13,5,'#8a5a32']],
    det: [[1,1,8,1,'#6b4226'],[2,3,7,1,'#6b4226'],[10,1,2,3,'#c79566'],[0,4,13,1,'#6b4226']] },
  { name: 'mushroom', u: 4, w: 9, h: 9, parts: [[1,0,7,4,'#3f7fd9'],[0,1,9,3,'#3f7fd9'],[3,4,3,5,'#f1d7b8']],
    det: [[2,1,2,1,'#8fc0ff'],[6,2,1,1,'#8fc0ff'],[3,4,3,1,'#c9a98a']] },
  { name: 'tree', u: 4, w: 8, h: 12, parts: [[3,0,2,2,G],[2,2,4,2,G],[1,4,6,2,G],[0,6,8,3,G],[3,9,2,3,'#8a5a32']],
    det: [[3,1,1,1,GL],[2,4,2,1,GL],[1,6,2,1,GL],[0,8,8,1,GD]] },
];
// Птица (смотрит вправо, при отрисовке отражаем). f — взмах крыльев
const BIRD = f => [
  [[2,2,6,3,'#5b5f7d'],[7,1,3,3,'#5b5f7d'], f ? [3,0,3,2,'#5b5f7d'] : [3,5,3,2,'#5b5f7d']],
  [[10,2,2,1,'#f2a33a'],[8,2,1,1,'#ffffff'],[3,4,4,1,'#9a9cb8']],
];
// Пиксельная монета, вращается (как в спрайт-листе)
function drawCoin(g, cx, cy, u, t) {
  g.save(); g.translate(cx, cy); g.scale(Math.max(0.2, Math.abs(Math.cos(t))), 1);
  drawParts(g, [[-2,-3,4,6,'#f7c948'],[-3,-2,6,4,'#f7c948']], [[-1,-2,2,4,'#e0a62e'],[-2,-1,1,2,'#fff4c2']], 0, 0, u);
  g.restore();
}

// ===================== СОХРАНЕНИЯ (LocalStorage) =====================
const store = {
  get(key, def) {
    try { const v = localStorage.getItem('runner_' + key); return v === null ? def : JSON.parse(v); }
    catch (e) { return def; }
  },
  set(key, val) { try { localStorage.setItem('runner_' + key, JSON.stringify(val)); } catch (e) {} },
};
let coins    = store.get('coins', 0);       // коины
let unlocked = store.get('unlocked', [0]);  // открытые персонажи (индексы)
let selected = store.get('selected', 0);    // выбранный персонаж
let best     = store.get('best', 0);        // рекорд
if (!unlocked.includes(selected)) selected = 0;

// Подхватываем свои картинки, если они раскомментированы в HTML
document.querySelectorAll('#sprites img').forEach(img => {
  const apply = () => { if (img.naturalWidth) { CHARACTERS[+img.dataset.char].img = img; renderShop(); } };
  img.complete ? apply() : img.addEventListener('load', apply);
});

// ===================== ХОЛСТ =====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

// ===================== СОСТОЯНИЕ ИГРЫ =====================
let state = 'menu';            // menu | shop | play | over
let speed, score, runCoins, obstacles, spawnIn, groundOffset = 0, overAt = 0, time = 0;
let duckHeld = false;          // зажата ли кнопка «пригнуться»
let popups = [];               // всплывающие «+1»
const player = { x: 60, z: 0, vy: 0, w: 40, h: 40 }; // z — высота лап над землёй
const clouds = [0, 1, 2].map(i => ({ x: 120 + i * 280, y: 40 + Math.random() * 60 }));
const decor = Array.from({ length: 22 }, () => ({ x: Math.random() * W, y: GROUND + 8 + Math.random() * 22, flower: Math.random() < 0.3 }));

function resetGame() {
  speed = START_SPEED; score = 0; runCoins = 0; obstacles = []; popups = [];
  spawnIn = 500; player.z = 0; player.vy = 0; player.h = 40; duckHeld = false;
}
resetGame();

// ===================== УПРАВЛЕНИЕ =====================
function jump() {
  if (state === 'play' && player.z === 0) player.vy = JUMP_V;
}
document.addEventListener('keydown', e => {
  const jumpKey = e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW';
  const duckKey = e.code === 'ArrowDown' || e.code === 'KeyS';
  if (jumpKey || duckKey || e.code === 'Enter') e.preventDefault(); // чтобы страница не прокручивалась
  if (state === 'play') { if (jumpKey) jump(); if (duckKey) duckHeld = true; }
  else if ((state === 'menu' || state === 'over') && (jumpKey || e.code === 'Enter')) {
    if (state === 'menu' || performance.now() - overAt > 400) startGame();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') duckHeld = false;
});
// Тап/клик в любом месте экрана во время игры — прыжок
document.addEventListener('pointerdown', e => {
  if (state === 'play' && !e.target.closest('button')) jump();
});
// Кнопка «пригнуться» для телефонов: держите её нажатой
const duckBtn = document.getElementById('duckBtn');
duckBtn.addEventListener('pointerdown', e => { e.preventDefault(); duckHeld = true; });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => duckBtn.addEventListener(ev, () => { duckHeld = false; }));
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');

// ===================== ЭКРАНЫ =====================
const $ = id => document.getElementById(id);
function showScreen(name) {
  state = name;
  ['menu', 'shop', 'over'].forEach(id => $(id).classList.toggle('hidden', id !== name));
  document.body.classList.toggle('playing', name === 'play');
  if (document.activeElement) document.activeElement.blur();
}
function startGame() { resetGame(); showScreen('play'); }

function gameOver() {
  overAt = performance.now();
  const s = Math.floor(score);
  const isRecord = s > best;
  if (isRecord) { best = s; store.set('best', best); }
  $('overText').innerHTML = `Очки: <b>${s}</b>${isRecord ? ' — новый рекорд! ♥' : ''}<br>` +
    `Рекорд: ${best}<br>Коинов за забег: ${runCoins} <i class="coin"></i> · Всего: ${coins} <i class="coin"></i>`;
  showScreen('over');
}

$('btnPlay').onclick = startGame;
$('btnRestart').onclick = startGame;
$('btnShop').onclick = () => { renderShop(); showScreen('shop'); };
$('btnShopBack').onclick = () => showScreen('menu');
$('btnOverMenu').onclick = () => showScreen('menu');
$('btnReset').onclick = () => {
  if (!confirm('Сбросить коины, открытых персонажей и рекорд?')) return;
  coins = 0; unlocked = [0]; selected = 0; best = 0;
  ['coins', 'unlocked', 'selected', 'best'].forEach(k => { try { localStorage.removeItem('runner_' + k); } catch (e) {} });
};

// Магазин: карточки персонажей
function renderShop() {
  $('shopCoins').textContent = coins;
  $('shopGrid').innerHTML = CHARACTERS.map((c, i) => {
    const open = unlocked.includes(i);
    let btn;
    if (i === selected) btn = '<button disabled>Выбран</button>';
    else if (open) btn = `<button data-select="${i}">Выбрать</button>`;
    else btn = `<button data-buy="${i}" ${coins < c.price ? 'disabled' : ''}><i class="coin"></i> ${c.price}</button>`;
    return `<div class="card${i === selected ? ' selected' : ''}${open ? '' : ' locked'}">
      <div class="pic"><canvas width="96" height="96" data-prev="${i}"></canvas></div>
      <div class="name">${i === selected ? '♥ ' : ''}P${i + 1} · ${c.name}</div>${btn}</div>`;
  }).join('');
  // Рисуем превью персонажей
  document.querySelectorAll('[data-prev]').forEach(cv => drawChar(cv.getContext('2d'), CHARACTERS[+cv.dataset.prev], 0, 0, 96, 0));
}
$('shopGrid').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.buy) {                    // покупка
    const i = +b.dataset.buy;
    if (coins < CHARACTERS[i].price) return;
    coins -= CHARACTERS[i].price; unlocked.push(i); selected = i;
    store.set('coins', coins); store.set('unlocked', unlocked); store.set('selected', selected);
  } else if (b.dataset.select) {          // выбор открытого
    selected = +b.dataset.select; store.set('selected', selected);
  }
  renderShop();
});

// ===================== ЛОГИКА =====================
function spawnObstacle() {
  let o;
  if (score > 250 && Math.random() < 0.3) {
    // Птица: z — высота над землёй. 2 — надо прыгать, 24 — пригнуться (или прыгнуть), 40 — пробежать под ней
    o = { type: 'bird', x: W + 20, w: 36, h: 21, z: [2, 24, 40][Math.floor(Math.random() * 3)], t: 0 };
  } else {
    const kind = GROUND_KINDS[Math.floor(Math.random() * GROUND_KINDS.length)];
    // Кусты на высокой скорости могут идти группой по 2–3
    const n = kind.name === 'bush' && speed > 500 ? 1 + Math.floor(Math.random() * 3) : 1;
    o = { type: 'ground', kind, n, x: W + 20, w: n * kind.w * kind.u, h: kind.h * kind.u };
  }
  obstacles.push(o);
  spawnIn = o.w + speed * (0.85 + Math.random() * 0.85); // расстояние до следующего
}

// Прямоугольники столкновений (чуть меньше картинки — так честнее)
function playerBox() {
  return { x: player.x + 7, y: GROUND - player.z - player.h + 5, w: player.w - 14, h: player.h - 8 };
}
function obstacleBox(o) {
  if (o.type === 'ground') return { x: o.x + 3, y: GROUND - o.h + 3, w: o.w - 6, h: o.h - 3 };
  return { x: o.x + 4, y: GROUND - o.z - o.h + 3, w: o.w - 8, h: o.h - 6 };
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function update(dt) {
  speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
  const dx = speed * dt;
  score += dx * 0.025;

  // Коины: каждые 500 очков — +1, сохраняем сразу
  const earned = Math.floor(score / POINTS_PER_COIN);
  if (earned > runCoins) {
    coins += earned - runCoins; runCoins = earned; store.set('coins', coins);
    popups.push({ t: 1 });
  }

  // Персонаж: гравитация (если пригнуться в воздухе — падает быстрее)
  player.vy -= GRAVITY * dt * (duckHeld ? 3 : 1);
  player.z += player.vy * dt;
  if (player.z <= 0) { player.z = 0; player.vy = 0; }
  player.h = duckHeld && player.z === 0 ? 24 : 40;

  // Препятствия
  spawnIn -= dx;
  if (spawnIn <= 0) spawnObstacle();
  const pb = playerBox();
  for (const o of obstacles) {
    o.x -= dx;
    if (o.type === 'bird') o.t += dt;
    if (overlap(pb, obstacleBox(o))) return gameOver();
  }
  obstacles = obstacles.filter(o => o.x + o.w > -20);

  // Фон: земля, трава, облака
  groundOffset = (groundOffset + dx) % 24;
  decor.forEach(d => { d.x -= dx; if (d.x < -10) d.x += W + 20; });
  moveClouds(speed * 0.15 * dt);
  popups.forEach(p => p.t -= dt); popups = popups.filter(p => p.t > 0);
}
function moveClouds(dx) {
  clouds.forEach(c => { c.x -= dx; if (c.x < -50) { c.x = W + 40 + Math.random() * 200; c.y = 30 + Math.random() * 70; } });
}

// ===================== ОТРИСОВКА =====================
function drawObstacle(o) {
  if (o.type === 'ground') {
    const k = o.kind;
    for (let i = 0; i < o.n; i++) drawParts(ctx, k.parts, k.det, o.x + i * k.w * k.u, GROUND - o.h, k.u);
  } else {
    const [parts, det] = BIRD(Math.sin(o.t * 12) > 0);
    ctx.save(); ctx.translate(o.x + o.w, GROUND - o.z - o.h); ctx.scale(-1, 1); // летит влево
    drawParts(ctx, parts, det, 0, 0, 3);
    ctx.restore();
  }
}
function drawPlayer() {
  const c = CHARACTERS[selected];
  const frame = state !== 'play' ? 0 : player.z > 0 ? 2 : Math.floor(time * 10) % 2;
  ctx.save();
  ctx.translate(player.x, GROUND - player.z);
  ctx.scale(1, player.h / 40);                 // пригнулся — сплющиваем спрайт
  drawChar(ctx, c, 0, -40, 40, frame);
  ctx.restore();
}
function drawHUD() {
  const pad = n => String(Math.floor(n)).padStart(5, '0');
  ctx.fillStyle = '#8c2a3c'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 18px ui-monospace, "Courier New", monospace';
  ctx.fillText(`HI ${pad(best)}  ${pad(score)}`, W - 16, 30);
  const txt = String(coins);
  ctx.fillText(txt, W - 16, 58);
  drawCoin(ctx, W - 30 - ctx.measureText(txt).width, 52, 2, time * 4);
  popups.forEach(p => {
    ctx.globalAlpha = p.t;
    ctx.fillText('+1', W - 16, 84 - (1 - p.t) * 20);
    ctx.globalAlpha = 1;
  });
}
function draw() {
  ctx.fillStyle = '#fff8f3'; ctx.fillRect(0, 0, W, H);
  // Пиксельные облака
  clouds.forEach(c => drawParts(ctx, [[3,0,4,1,'#fff'],[1,1,8,2,'#fff'],[0,2,11,2,'#fff']], [[1,3,9,1,'#d6e6f5']], c.x, c.y, 3));
  // Земля — пунктирная линия + травинки и цветочки под ней
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 3;
  ctx.setLineDash([16, 8]); ctx.lineDashOffset = groundOffset;
  ctx.beginPath(); ctx.moveTo(0, GROUND + 1.5); ctx.lineTo(W, GROUND + 1.5); ctx.stroke();
  ctx.setLineDash([]);
  decor.forEach(d => {
    ctx.fillStyle = d.flower ? '#f2a7c6' : '#7cc24f';
    ctx.fillRect(d.x, d.y, 3, 3);
    if (!d.flower) ctx.fillRect(d.x + 4, d.y - 3, 3, 6);
  });

  obstacles.forEach(drawObstacle);
  drawPlayer();
  drawHUD();
}

// ===================== ИГРОВОЙ ЦИКЛ =====================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); // ограничиваем шаг, если вкладка «спала»
  last = now; time += dt;
  if (state === 'play') update(dt); else moveClouds(15 * dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
